- type: entity
  abstract: true
  parent: CMBaseStructure
  id: RMCPropComputerBase
  name: terminal
  description: This can be used for various functions.
  suffix: Prop
  components:
  - type: Transform
    anchored: false
  - type: Physics
    bodyType: Static
    canCollide: false
  - type: Sprite
    drawdepth: SmallObjects
    sprite: _RMC14/Structures/Machines/computer.rsi
    state: terminal
    layers: [ ]
  - type: Clickable
  - type: Corrodible
    isCorrodible: false
  - type: InteractionOutline
  - type: Damageable
    damageModifierSet: Metallic
  - type: Injurable
    damageContainer: Inorganic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 50
      behaviors:
      - !type:DoActsBehavior
        acts: ["Destruction"]
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
  - type: InteractedBlacklist
    blacklist:
      components:
      - Xeno
  - type: WallMount
    arc: 360

- type: entity
  parent: RMCPropComputerBase
  id: RMCPropCommunicationsConsole
  name: communications console
  components:
  - type: Sprite
    state: comm

- type: entity
  parent: RMCPropCommunicationsConsole
  id: RMCPropCommunicationsConsoleAlt
  suffix: Prop, Alt
  components:
  - type: Sprite
    state: comm_alt

- type: entity
  parent: RMCPropComputerBase
  id: RMCPersonalDesktop
  name: personal desktop
  components:
  - type: Sprite
    state: terminal1
  # CMU14 PersonalComputers Begin: boots the ExtraNet browser
  - type: CMUPersonalComputer
  - type: ActivatableUI
    key: enum.CMUPersonalComputerUiKey.Key
  - type: UserInterface
    interfaces:
      enum.CMUPersonalComputerUiKey.Key:
        type: CMUPersonalComputerBui
      enum.CMUDeepHackUiKey.Key:
        type: CMUDeepHackBui
      enum.RMCCameraUiKey.Key:
        type: RMCCameraBui
      enum.CMUComputerToolUiKey.Key:
        type: CMUComputerToolBui
      enum.CMUComputerLogUiKey.Key:
        type: CMUComputerLogBui
  - type: CMUDeepWebHackable
  # Camera feeds tapped from the deep web; the network is set when a cam:// link is followed.
  - type: RMCCameraComputer
    title: cmu-deep-eyes-camera-title
  - type: CameraNetworkReceiver
    supportedSources: All
  # CMU14 End

- type: entity
  parent: RMCPropComputerBase
  id: RMCSecurityCameraConsole
  name: security cameras console
  components:
  - type: Sprite
    state: security_cam

- type: entity
  parent: RMCSecurityCameraConsole
  id: RMCDropshipWeaponsConsoleProp
  name: dropship weapons controls
  components:
  - type: Sprite
    drawdepth: Objects
  - type: PointLight
    enabled: true
    radius: 1.5
    netsync: true
    energy: 1
    offset: "0,0"
    color: "#FFEFD2"
    lightMask: ConeQuad

- type: entity
  parent: RMCPropComputerBase
  id: RMCSecurityRecordsConsole
  name: security records
  components:
  - type: Sprite
    state: jas

- type: entity
  parent: RMCPropComputerBase
  id: RMCSecurityRecordsConsoleAlt
  name: security records
  components:
  - type: Sprite
    state: security

- type: entity
  parent: RMCPropComputerBase
  id: RMCIdentificationComputer
  name: identification computer
  components:
  - type: Sprite
    state: engineering_terminal

- type: entity
  parent: RMCPropComputerBase
  id: RMCStationAlertComputer
  name: station alert computer
  components:
  - type: Sprite
    state: atmos

- type: entity
  parent: RMCPropComputerBase
  id: RMCSystemsComputer
  name: systems computer
  components:
  - type: Sprite
    state: terminal
