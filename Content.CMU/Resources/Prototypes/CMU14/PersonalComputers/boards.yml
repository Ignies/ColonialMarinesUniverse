# Board sites: postings made during the round by key roles, commented on by anyone who reaches the site.
# The index page is the masthead; postings run under it. Posters are exact job ids, variants included.

- type: cmuNetSite
  id: CMUNetSiteColonyHerald
  address: herald.colony.news
  title: cmu-net-site-colony-herald
  networks:
  - CMUNetPublic
  root: /ServerInfo/CMU14/ExtraNet/Boards/Herald/
  style:
    background: "#F1EBDD"
    text: "#1E1E1E"
    heading: "#8A1C1C"
    link: "#1F4F7A"
    font: Sans
  pages:
    "": index.xml
  board:
    postLabel: cmu-net-board-herald-post
    empty: cmu-net-board-herald-empty
    posters:
    - AU14JobCivilianJournalist

