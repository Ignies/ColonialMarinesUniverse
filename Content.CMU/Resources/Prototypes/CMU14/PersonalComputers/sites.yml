# ExtraNet sites. Add a page: write the document under the site's root, then list it in pages.
# Link between pages with [netlink="Text" link="host/path"]. A site style sets the default look of its pages.
# See Content.CMU/Docs/personal-computers.md for every tag.

- type: cmuNetSite
  id: CMUNetSiteSeegsonColony
  address: colony.seegson.net
  title: cmu-net-site-seegson-colony
  networks:
  - CMUNetPublic
  root: /ServerInfo/CMU14/ExtraNet/Seegson/Colony/
  pages:
    "": index.xml
    notices: notices.xml
    housing: housing.xml
    radio: radio.xml

- type: cmuNetSite
