# The gun jeep's other mounted guns. Each fits the pedestal mount in place of the machine gun, swapped
# through vehicle maintenance with the jack, and is drawn on the jeep in its own art.

# An automatic grenade launcher: lobs a round to where it's aimed, up to ten tiles off. Its rounds
# burst a moment after landing, and it won't fire at anything so close the burst would reach the jeep.
- type: entity
  parent: CMUJeepHardpointBase
  id: CMUJeepGrenadeLauncher
  name: jeep grenade launcher
  description: An automatic grenade launcher for the gun jeep's pedestal. It lobs its rounds where it's aimed, and won't fire at anything within three tiles.
  components:
  - type: ContainerContainer
    containers:
      ballistic-ammo: !type:Container
        ents: []
        showEnts: False
        occludes: True
  - type: Sprite
    state: glturret
  - type: HardpointItem
    hardpointType: Cannon
    vehicleFamily: CMUJeep
    slotType: Cannon
    damageMultiplier: 0.1
    repairRate: 0.01
  - type: HardpointIntegrity
    maxIntegrity: 75
    integrity: 75
  - type: VehicleTurretAttachment
  - type: VehicleTurret
    showOverlay: false
    fireWhileRotatingGraceDegrees: 15
    useBarrelDirectionForShots: true
    maxShotCurvatureDegrees: 10
  - type: GunUseGunOrigin
  - type: GunIgnoreContainerOwnerCollision
  - type: GunIgnorePrediction
  - type: Gun
    fireRate: 0.15 # About seven seconds between rounds, slower than the tank's launcher.
    projectileSpeed: 18
    minAngle: 6
    maxAngle: 6
    selectedMode: SemiAuto
    availableModes:
    - SemiAuto
    soundGunshot: /Audio/CMU14/Weapons/agl/gun_agl_fire1.ogg
    cameraRecoilScalar: 0
  - type: ShootAtFixedPoint
    shootArcProj: true
    maxFixedRange: 10
  - type: OnShootTriggerAmmoTimer
    delay: 1.5
  - type: CMUGunMinimumRange
    range: 3
  - type: RMCWeaponAccuracy
    accuracyMultiplier: 4
    accuracyMultiplierUnwielded: 4
  - type: BallisticAmmoProvider
    cycleable: false
    proto: CMGrenadeHighExplosive
    capacity: 6
  - type: VehicleHardpointAmmo
    magazineSize: 6
    maxStoredMagazines: 1
  - type: GunFireArc
    arc: 100
  - type: RefillableByBulletBox
    bulletType: VehicleAmmoBoxGrenadeLauncher
  - type: CMUVehicleGunOrigin
    pivot: "0,0.5"
    barrel: 0.5
  - type: CMUVehicleTurretArt
    state: glturret_0
    damagedState: glturret_1

# A two-tube pod of light rockets: enough to make an APC's crew think twice or knock a tank's gear
# about, not to kill either. It fires no faster than the tank's own launcher, carries two, and reloads
# from its own rocket crates. Its backblast knocks down and scorches anyone standing behind it.
- type: entity
  parent: CMUJeepHardpointBase
  id: CMUJeepRocketPod
  name: jeep rocket pod
  description: A two-tube pod of light rockets for the gun jeep's pedestal, loaded from jeep rocket crates. Don't stand behind it.
  components:
  - type: ContainerContainer
    containers:
      ballistic-ammo: !type:Container
        ents: []
        showEnts: False
        occludes: True
  - type: Sprite
    state: rlturret
  - type: HardpointItem
    hardpointType: Cannon
    vehicleFamily: CMUJeep
    slotType: Cannon
    damageMultiplier: 0.1
    repairRate: 0.01
  - type: HardpointIntegrity
    maxIntegrity: 75
    integrity: 75
  - type: VehicleTurretAttachment
  - type: VehicleTurret
    showOverlay: false
    fireWhileRotatingGraceDegrees: 10
    useBarrelDirectionForShots: true
    maxShotCurvatureDegrees: 5
  - type: GunUseGunOrigin
  - type: GunIgnoreContainerOwnerCollision
  - type: GunIgnorePrediction
  - type: Gun
    fireRate: 0.0667 # Fifteen seconds between rockets, like the tank's launcher.
    projectileSpeed: 18
    minAngle: 4
    maxAngle: 4
    selectedMode: SemiAuto
    availableModes:
    - SemiAuto
    soundGunshot:
      path: /Audio/CMU14/Weapons/vehicle/towfire.ogg
    cameraRecoilScalar: 0
  - type: CMUGunBackblast
    range: 2.5
    arc: 60
    damage:
      types:
        Heat: 15
        Blunt: 10
  - type: RMCWeaponAccuracy
    accuracyMultiplier: 5
    accuracyMultiplierUnwielded: 5
  - type: BallisticAmmoProvider
    cycleable: false
    proto: CMUJeepRocket
    capacity: 2
  - type: VehicleHardpointAmmo
    magazineSize: 2
    maxStoredMagazines: 1
  - type: GunFireArc
    arc: 90
  - type: RefillableByBulletBox
    bulletType: CMUJeepRocketBox
  - type: CMUVehicleGunOrigin
    pivot: "0,0.5"
    barrel: 0.5
  - type: CMUVehicleTurretArt
    state: rlturret_0
    damagedState: rlturret_1

- type: entity
  parent: RMCCrateBase
  id: CMUCrateJeepGrenadeLauncher
  name: jeep grenade launcher crate
  description: A jeep grenade launcher, to swap for the gun jeep's machine gun. Its rounds come in grenade launcher ammo crates.
  components:
  - type: StorageFill
    contents:
    - id: CMUJeepGrenadeLauncher

- type: entity
  parent: RMCCrateBase
  id: CMUCrateJeepRocketPod
  name: jeep rocket pod crate
  description: A jeep rocket pod, to swap for the gun jeep's machine gun, with a crate of its rockets.
  components:
  - type: StorageFill
    contents:
    - id: CMUJeepRocketPod
    - id: CMUJeepRocketBox

- type: entity
  parent: RMCCrateBase
  id: CMUCrateJeepRockets
  name: jeep rocket supply crate
  description: Two jeep rocket crates for the gun jeep's rocket pod, four light rockets in each.
  components:
  - type: StorageFill
    contents:
    - id: CMUJeepRocketBox
      amount: 2

# The rocket pod's light rocket: a smaller warhead than the 84mm, without the anti-armor round's
# cook-off and hull damage. A hit staggers and burns, and does a vehicle a fraction of a TOW's harm.
- type: entity
  parent: VehicleRocket84mmAntiArmor
  id: CMUJeepRocket
  categories: [ HideSpawnMenu ]
  name: jeep light rocket
  components:
  - type: CartridgeAmmo
    proto: CMUJeepProjectileRocket
    deleteOnSpawn: false

- type: entity
  parent: RMCProjectileRocket84mm
  id: CMUJeepProjectileRocket
  categories: [ HideSpawnMenu ]
  name: jeep light rocket
  components:
  - type: Projectile
    impactEffect: BulletImpactEffect
    damage:
      types:
        Blunt: 40
        Heat: 40
    maxFixedRange: 20
  - type: CMArmorPiercing
    amount: 15
  - type: Explosive
    explosionType: RMC
    maxIntensity: 8
    intensitySlope: 4
    totalIntensity: 40
    maxTileBreak: 0
  - type: VehicleDamageMultiplier
    multiplier: 2
  - type: RMCKnockOutOnCollide
    paralyzeTime: 1.5
  - type: TriggerOnFixedDistanceStop
    delay: 0

- type: entity
  parent: VehicleAmmoBoxBase
  id: CMUJeepRocketBox
  name: jeep rocket crate
  description: Four light rockets for the gun jeep's rocket pod.
  components:
  - type: Sprite
    layers:
    - state: quad_rocket
      map: [ "enum.BulletBoxLayers.Fill" ]
  - type: GenericVisualizer
    visuals:
      enum.BulletBoxLayers.Fill:
        enum.BulletBoxLayers.Fill:
          Empty: { state: quad_rocket_e, visible: true }
          Low: { state: quad_rocket_e, visible: true }
          Medium: { state: quad_rocket, visible: true }
          High: { state: quad_rocket, visible: true }
          Full: { state: quad_rocket, visible: true }
  - type: BulletBox
    amount: 4
    max: 4
    ammoProto: CMUJeepRocket
    bulletType: CMUJeepRocketBox
    usedIn: Jeep rocket pod
